<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ff6b00">
  <title>ESS — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #171717;
    }
    main {
      width: min(520px, 100%);
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #ff6b00;
      color: #fff;
      font-weight: 800;
      font-size: 24px;
    }
    h1 { margin: 0 0 12px; }
    p {
      color: #555;
      line-height: 1.6;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      background: #ff6b00;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">ESS</div>
    <h1>You're offline</h1>
    <p>
      Your connection is unavailable. Saved work can remain available
      offline, and pending changes will sync when you reconnect.
    </p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
