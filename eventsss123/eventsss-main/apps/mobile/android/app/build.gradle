apply plugin: 'com.android.application'

// Resolve the version before entering the Android DSL; this keeps local builds
// on version 2 and lets the protected release workflow supply a higher value.
def ephintaVersionCode = ((project.findProperty('ephintaVersionCode') ?: System.getenv('EPHINTA_VERSION_CODE')) ?: '2').toString().toInteger()

android {
    namespace "com.ephinta.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ephinta.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Production release workflow supplies 870+; retain 2 for ordinary debug/dev builds.
        versionCode ephintaVersionCode
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath != null && !keystorePath.trim().isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

/**
 * Use the existing EPHINTA brand icon files for Android launcher and splash assets.
 * These are copied from apps/web/public so the native APK always matches the web brand.
 */
def ephintaBrandIconDir = file("../../../web/public/brand/optimized/mark")
def ephintaAndroidIconSizes = [mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192]

tasks.register("syncEphintaAndroidBranding") {
    doLast {
        if (!ephintaBrandIconDir.isDirectory()) {
            throw new GradleException("Missing EPHINTA icon assets: ${ephintaBrandIconDir}")
        }

        ephintaAndroidIconSizes.each { density, pixels ->
            def sourceIcon = new File(ephintaBrandIconDir, "app-icon-${pixels}.png")
            def sourceForeground = new File(ephintaBrandIconDir, "app-icon-foreground-${pixels}.png")
            if (!sourceIcon.isFile()) {
                throw new GradleException("Missing EPHINTA launcher icon: ${sourceIcon}")
            }
            if (!sourceForeground.isFile()) {
                throw new GradleException("Missing EPHINTA adaptive foreground icon: ${sourceForeground}")
            }
            def targetDir = file("src/main/res/mipmap-${density}")
            targetDir.mkdirs()
            copy { from sourceIcon; into targetDir; rename { "ic_launcher.png" } }
            copy { from sourceIcon; into targetDir; rename { "ic_launcher_round.png" } }
            copy { from sourceForeground; into targetDir; rename { "ic_launcher_foreground.png" } }
        }

        def splashSource = new File(ephintaBrandIconDir, "app-icon-512.png")
        if (!splashSource.isFile()) {
            throw new GradleException("Missing EPHINTA splash artwork: ${splashSource}")
        }
        def splashDir = file("src/main/res/drawable-nodpi")
        splashDir.mkdirs()
        copy { from splashSource; into splashDir; rename { "ephinta_splash_logo.png" } }
    }
}

tasks.named("preBuild").configure {
    dependsOn("syncEphintaAndroidBranding")
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
