name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [add-event-planning-api]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Set in repo: Settings -> Secrets and variables -> Actions -> Variables
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_UPDATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check update host
        run: |
          expected="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          test "$VITE_UPDATE_URL" = "$expected" || { echo "::error::OTA host must be $expected"; exit 1; }
          echo "OTA host: $VITE_UPDATE_URL"

      - name: Check API URL
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Add repo variable VITE_API_URL (e.g. https://eventsss.onrender.com/api/v1) under Settings > Secrets and variables > Actions > Variables"; exit 1
          fi
          case "$VITE_API_URL" in https://*) ;; *) echo "::error::VITE_API_URL must start with https://"; exit 1;; esac
          base="${VITE_API_URL%/api/v1}"
          curl -fsS --retry 6 --retry-delay 10 --max-time 60 "$base/health" > /dev/null
          echo "API health check passed"

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do
            if [ -z "${!v}" ]; then
              echo "::error::A signing secret is missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD under Settings > Secrets and variables > Actions > Secrets"
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - run: npm ci

      - name: Full API quality gate
        env:
          DATABASE_URL: postgresql://ess:ess@localhost:5432/ess
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          APP_BASE_URL: http://localhost:3000
        run: npm run check

      - name: Build API
        run: npm run build -w apps/api

      - name: Build web app with OTA endpoint
        env:
          VITE_UPDATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build -w apps/web

      - name: Add Android project if missing
        working-directory: apps/mobile
        run: test -d android || npx cap add android

      - name: Sync web build into Android
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Compile against Android SDK 35 (needed by newer AndroidX libraries)
        working-directory: apps/mobile/android
        run: |
          sed -i -E 's/compileSdkVersion = [0-9]+/compileSdkVersion = 35/' variables.gradle
          grep -n "compileSdkVersion" variables.gradle
          grep -q "suppressUnsupportedCompileSdk" gradle.properties || printf '\nandroid.suppressUnsupportedCompileSdk=35\n' >> gradle.properties
          tail -3 gradle.properties

      - name: Raise minSdk to 23 (needed by newer AndroidX libraries)
        working-directory: apps/mobile/android
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 23/' variables.gradle
          grep -n "minSdkVersion\|compileSdkVersion" variables.gradle

      - name: Harden Android manifest
        working-directory: apps/mobile/android/app/src/main
        run: |
          python3 - <<'PYEOF'
          import re, sys
          p = "AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          def put(s, name, val):
              pat = r'android:%s="[^"]*"' % name
              if re.search(pat, s):
                  return re.sub(pat, 'android:%s="%s"' % (name, val), s, count=1)
              return s.replace("<application", '<application android:%s="%s"' % (name, val), 1)
          s = put(s, "allowBackup", "false")
          s = put(s, "usesCleartextTraffic", "false")
          if re.search(r'android:debuggable="true"', s):
              print("ERROR: manifest is marked debuggable"); sys.exit(1)
          open(p, "w", encoding="utf-8").write(s)
          PYEOF
          grep -n "allowBackup\|usesCleartextTraffic\|debuggable" AndroidManifest.xml

      - name: Set version code (must increase for every update)
        working-directory: apps/mobile/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          grep -n "versionCode" build.gradle

      - name: Restore and validate Android signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Android signing secret: $name"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/ephinta-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi

          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/ess-release.apk"

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          test -s ess-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs ess-release.apk
          sha256sum ess-release.apk

      - name: Verify APK contents
        run: |
          set -euo pipefail
          test -s ess-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify ess-release.apk
          unzip -t ess-release.apk >/dev/null
          echo "Release APK verification passed."

      - name: Verify signing key fingerprint
        env:
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          ACTUAL="$("$BT/apksigner" verify --print-certs ess-release.apk | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')"
          echo "Signing certificate SHA-256: $ACTUAL"
          if [ -z "$EXPECTED" ]; then
            echo "::error::Set repository variable ANDROID_CERT_SHA256 to the signing certificate fingerprint: $ACTUAL"
            exit 1
          fi
          WANT="$(echo "$EXPECTED" | tr -d ': ' | tr 'A-Z' 'a-z')"
          if [ "$ACTUAL" != "$WANT" ]; then
            echo "::error::APK was signed with a DIFFERENT key than expected. Not publishing it."
            exit 1
          fi
          echo "Signing key matches."

      - name: Build OTA bundle
        env:
          SKIP_BUILD: "1"
          UPDATE_VERSION: ${{ github.sha }}
        run: ./scripts/build-update-bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ess-release-apk
          path: ess-release.apk