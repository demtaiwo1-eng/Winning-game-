name: EPHINTA dependency security audit

on:
  pull_request:
    paths:
      - "eventsss123/eventsss-main/package.json"
      - "eventsss123/eventsss-main/package-lock.json"
      - "eventsss123/eventsss-main/apps/**/package.json"
      - "eventsss123/eventsss-main/.github/workflows/dependency-security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: Audit locked npm dependency tree
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Capture full npm advisory report
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_exit=$?
          set -e
          echo "npm audit exit code: ${audit_exit}"
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('Dependency vulnerability counts:');
          for (const level of ['info', 'low', 'moderate', 'high', 'critical', 'total']) {
            console.log(`- ${level}: ${counts[level] ?? 0}`);
          }
          const advisories = Object.entries(report.vulnerabilities ?? {});
          for (const [name, item] of advisories) {
            console.log(`- ${name}: severity=${item.severity}; direct=${item.isDirect}; range=${item.range}; fixAvailable=${JSON.stringify(item.fixAvailable)}`);
          }
          const blocking = (counts.high ?? 0) + (counts.critical ?? 0);
          if (blocking > 0) {
            console.error(`Security gate failed: ${blocking} high/critical vulnerability finding(s).`);
            process.exitCode = 1;
          } else {
            console.log('Security gate passed: no high or critical findings.');
          }
          NODE
      - name: Upload complete advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-npm-audit-report
          path: eventsss123/eventsss-main/npm-audit.json
          if-no-files-found: warn
          retention-days: 30
