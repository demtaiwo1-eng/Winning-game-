name: Android install and launch smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "eventsss123/eventsss-main/apps/mobile/**"
      - "eventsss123/eventsss-main/apps/web/**"
      - "eventsss123/eventsss-main/package-lock.json"
      - ".github/workflows/android-install-smoke.yml"

permissions:
  contents: read

concurrency:
  group: android-install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-launch:
    name: Build, install, and launch on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: eventsss123/eventsss-main

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web application
        run: npm run build:web

      - name: Sync Capacitor Android project
        run: npm run sync -w apps/mobile

      - name: Build debug APK
        working-directory: eventsss123/eventsss-main/apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Install and launch APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -euo pipefail
            APK="eventsss123/eventsss-main/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
            adb wait-for-device
            adb install -r "$APK"
            adb shell pm path com.ephinta.app
            adb shell am force-stop com.ephinta.app
            adb shell am start -W -n com.ephinta.app/.MainActivity
            sleep 8
            if ! adb shell pidof com.ephinta.app >/dev/null; then
              echo "EPHINTA process did not remain alive after launch."
              adb logcat -d -t 1500
              exit 1
            fi
            echo "EPHINTA installed and remained running after launch."

      - name: Upload APK for manual device testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-android-emulator-verified-debug-apk
          path: eventsss123/eventsss-main/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
