name: Deploy Supabase API Gateway

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ess-supabase-api-gateway
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN as a repository Actions secret."
            exit 1
          fi
          if [[ -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "::error::Add SUPABASE_PROJECT_REF as a repository Actions variable."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/ess-api-proxy/index.ts supabase/functions/ess-api-proxy/handler_test.ts

      - name: Test Supabase Edge Function
        run: deno test --allow-env supabase/functions/ess-api-proxy/handler_test.ts

      - name: Deploy API gateway
        run: supabase functions deploy ess-api-proxy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Publish configured gateway URL
        shell: bash
        run: |
          set -euo pipefail
          gateway_url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/ess-api-proxy"
          echo "Supabase API gateway deployed at: ${gateway_url}"
          {
            echo "## Supabase API gateway deployed"
            echo
            echo "- Gateway: \`${gateway_url}\`"
            echo "- Set the repository Actions variable \`VITE_API_URL\` to \`${gateway_url}/api/v1\`."
            echo "- Ensure Supabase secret \`ESS_API_BASE_URL\` points to the upstream HTTPS API origin."
          } >> "$GITHUB_STEP_SUMMARY"
