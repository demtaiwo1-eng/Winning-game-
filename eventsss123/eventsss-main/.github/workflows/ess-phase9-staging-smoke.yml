name: ESS Phase 9 Staging Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE_URL: ${{ vars.ESS_STAGING_API_URL }}
      WEB_BASE_URL: ${{ vars.ESS_STAGING_WEB_URL }}
      SMOKE_TIMEOUT_SECONDS: "15"
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Check required staging URLs
        shell: bash
        run: |
          [[ -n "$API_BASE_URL" ]] || { echo "Missing repository variable ESS_STAGING_API_URL" >&2; exit 1; }
          [[ -n "$WEB_BASE_URL" ]] || { echo "Missing repository variable ESS_STAGING_WEB_URL" >&2; exit 1; }
      - name: Run staging smoke test
        run: bash scripts/phase9-production-smoke-test.sh
