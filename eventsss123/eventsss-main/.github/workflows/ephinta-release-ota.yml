name: EPHINTA APK Release and Live Updates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ephinta-release-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build web app with update endpoint
        env:
          VITE_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download
        run: npm run build:web

      - name: Sync Capacitor Android
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Package web update bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/dist/index.html
          mkdir -p release-assets
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             release-assets/ephinta-debug.apk

          (
            cd apps/web/dist
            zip -qr ../../release-assets/ephinta-web-bundle.zip .
          )

          VERSION="${GITHUB_SHA::12}"
          BUNDLE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/ephinta-web-bundle.zip"

          printf '{\n  "version": "%s",\n  "url": "%s"\n}\n' \
            "$VERSION" "$BUNDLE_URL" > release-assets/version.json

          echo "Built version: $VERSION"
          ls -lh release-assets

      - name: Upload APK and OTA bundle as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-apk-and-ota-${{ github.run_number }}
          path: release-assets/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish downloadable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ephinta-build-${{ github.run_number }}
          name: EPHINTA Build ${{ github.run_number }}
          body: |
            EPHINTA Android APK and web-layer update bundle.
            The APK in this workflow is a debug build.
            Web-layer OTA updates do not replace native Android updates.
          make_latest: true
          files: |
            release-assets/ephinta-debug.apk
            release-assets/ephinta-web-bundle.zip
            release-assets/version.json
