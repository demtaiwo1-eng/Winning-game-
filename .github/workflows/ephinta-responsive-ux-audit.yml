name: EPHINTA responsive UX audit

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "eventsss123/eventsss-main/apps/web/**"
      - ".github/workflows/ephinta-responsive-ux-audit.yml"
      - "eventsss123/eventsss-main/scripts/ux-audit.mjs"
  push:
    branches: [main]
    paths:
      - "eventsss123/eventsss-main/apps/web/**"
      - ".github/workflows/ephinta-responsive-ux-audit.yml"
      - "eventsss123/eventsss-main/scripts/ux-audit.mjs"

jobs:
  responsive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ess
          POSTGRES_PASSWORD: ess
          POSTGRES_DB: ess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ess -d ess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    env:
      DATABASE_MODE: local
      DATABASE_URL_LOCAL: postgresql://ess:ess@127.0.0.1:5432/ess?schema=public
      DATABASE_URL: postgresql://ess:ess@127.0.0.1:5432/ess?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-responsive-audit-secret-0123456789abcdef
      APP_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json
      - run: npm ci
      - name: Apply test database schema
        run: npm run db:deploy -w apps/api
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: eventsss123/eventsss-main/apps/web
      - name: Run responsive audit and capture screenshots
        run: npm run ux:audit
      - name: Upload responsive screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-responsive-ux-audit
          path: |
            eventsss123/eventsss-main/apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14
