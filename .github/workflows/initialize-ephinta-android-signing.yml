name: Initialize EPHINTA Android Signing Key

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ephinta-android-signing-bootstrap
  cancel-in-progress: false

jobs:
  initialize-signing:
    name: Generate and securely register the permanent signing key
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ADMIN_TOKEN: ${{ secrets.EPHINTA_SECRETS_ADMIN_TOKEN }}
      BACKUP_PASSWORD: ${{ secrets.EPHINTA_KEY_BACKUP_PASSPHRASE }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse unsafe signing-key rotation
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Automatic key generation is disabled to protect existing EPHINTA installations."
          echo "A replacement key cannot update Build 869. Recover the original private keystore and register its existing credentials and matching certificate fingerprint."
          exit 1

