name: EPHINTA signed iOS distribution build

on:
  pull_request:
    paths:
      - ".github/workflows/ephinta-ios-signed-release.yml"
      - "eventsss123/eventsss-main/docs/IOS_SIGNED_RELEASE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ephinta-ios-signed-release
  cancel-in-progress: false

jobs:
  validate-release-config:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML and distribution secret references
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ephinta-ios-signed-release.yml", aliases: true)'
          grep -q 'secrets.IOS_CERTIFICATE_P12_BASE64' .github/workflows/ephinta-ios-signed-release.yml
          grep -q 'secrets.IOS_CERTIFICATE_PASSWORD' .github/workflows/ephinta-ios-signed-release.yml
          grep -q 'secrets.IOS_PROVISIONING_PROFILE_BASE64' .github/workflows/ephinta-ios-signed-release.yml
          grep -q 'secrets.IOS_TEAM_ID' .github/workflows/ephinta-ios-signed-release.yml
          grep -q 'vars.IOS_CERT_SHA256' .github/workflows/ephinta-ios-signed-release.yml

  signed-ios:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Archive and export signed iOS IPA
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ephinta-wss.onrender.com/api/v1' }}
      VITE_UPDATE_URL: ${{ format('{0}/app-updates', vars.VITE_API_URL || 'https://ephinta-wss.onrender.com/api/v1') }}
      VITE_APP_VERSION: ${{ github.sha }}
      IOS_BUNDLE_ID: com.eventselfsolutions.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Require owner-configured Apple signing secrets
        shell: bash
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPECTED_CERT: ${{ vars.IOS_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in P12_BASE64 P12_PASSWORD PROFILE_BASE64 TEAM_ID EXPECTED_CERT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done

      - name: Install dependencies and build web assets
        run: |
          npm ci
          npm run build:web

      - name: Sync Capacitor iOS project
        run: npm run ios:sync -w apps/mobile

      - name: Install and validate Apple signing material
        shell: bash
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPECTED_CERT: ${{ vars.IOS_CERT_SHA256 }}
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/ephinta-ios-signing"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$SIGN_DIR" "$PROFILE_DIR"
          printf '%s' "$P12_BASE64" | base64 --decode > "$SIGN_DIR/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$SIGN_DIR/profile.mobileprovision"
          chmod 600 "$SIGN_DIR/distribution.p12" "$SIGN_DIR/profile.mobileprovision"
          ACTUAL_CERT="$(openssl pkcs12 -in "$SIGN_DIR/distribution.p12" -passin "pass:$P12_PASSWORD" -clcerts -nokeys 2>/dev/null | openssl x509 -noout -fingerprint -sha256 | awk -F= '/Fingerprint/ {print $2}')"
          ACTUAL_NORMALIZED="$(printf '%s' "$ACTUAL_CERT" | tr -d ': ' | tr 'A-Z' 'a-z')"
          EXPECTED_NORMALIZED="$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr 'A-Z' 'a-z')"
          if [[ -z "$ACTUAL_NORMALIZED" || "$ACTUAL_NORMALIZED" != "$EXPECTED_NORMALIZED" ]]; then
            echo "::error::Apple distribution certificate does not match IOS_CERT_SHA256."
            exit 1
          fi
          security cms -D -i "$SIGN_DIR/profile.mobileprovision" > "$SIGN_DIR/profile.plist"
          python3 - "$SIGN_DIR/profile.plist" <<'PY'
          import datetime, plistlib, sys
          with open(sys.argv[1], "rb") as stream:
              profile = plistlib.load(stream)
          expiry = profile.get("ExpirationDate")
          if not isinstance(expiry, datetime.datetime):
              raise SystemExit("Provisioning profile has no valid expiry date.")
          if expiry.tzinfo is None:
              expiry = expiry.replace(tzinfo=datetime.timezone.utc)
          if expiry <= datetime.datetime.now(datetime.timezone.utc):
              raise SystemExit("Provisioning profile has expired.")
          PY
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGN_DIR/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$SIGN_DIR/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$SIGN_DIR/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$SIGN_DIR/profile.plist")
          GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$SIGN_DIR/profile.plist")
          [[ "$PROFILE_TEAM" == "$TEAM_ID" ]] || { echo "::error::Provisioning profile Team ID does not match IOS_TEAM_ID."; exit 1; }
          [[ "$PROFILE_APP_ID" == "$TEAM_ID.$IOS_BUNDLE_ID" ]] || { echo "::error::Provisioning profile application identifier does not match the configured app bundle ID."; exit 1; }
          [[ "$GET_TASK_ALLOW" == "false" ]] || { echo "::error::A distribution profile is required; development profiles are not accepted."; exit 1; }
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$SIGN_DIR/profile.plist" >/dev/null 2>&1; then
            echo "::error::Use an App Store Connect distribution profile, not an Ad Hoc profile."
            exit 1
          fi
          cp "$SIGN_DIR/profile.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          KEYCHAIN_PATH="$SIGN_DIR/ephinta-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGN_DIR/distribution.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          {
            echo "IOS_PROFILE_NAME=$PROFILE_NAME"
            echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "IOS_SIGNING_DIR=$SIGN_DIR"
          } >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace apps/mobile/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EPHINTA.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/ephinta-ios-derived" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            archive

      - name: Export and verify signed IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: com.eventselfsolutions.app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": "app-store-connect",
              "teamID": os.environ["IOS_TEAM_ID"],
              "signingStyle": "manual",
              "provisioningProfiles": {
                  "com.eventselfsolutions.app": os.environ["IOS_PROFILE_NAME"]
              },
              "destination": "export",
              "stripSwiftSymbols": True,
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as f:
              plistlib.dump(options, f)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EPHINTA.xcarchive" \
            -exportPath "$RUNNER_TEMP/ephinta-ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA="$(find "$RUNNER_TEMP/ephinta-ios-export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA" && test -s "$IPA"
          mkdir -p "$RUNNER_TEMP/ephinta-ipa-check"
          ditto -x -k "$IPA" "$RUNNER_TEMP/ephinta-ipa-check"
          APP="$RUNNER_TEMP/ephinta-ipa-check/Payload/App.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          SIGNATURE_INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          printf '%s\\n' "$SIGNATURE_INFO" | grep -Fx "Identifier=$IOS_BUNDLE_ID"
          printf '%s\\n' "$SIGNATURE_INFO" | grep -Fx "TeamIdentifier=$IOS_TEAM_ID"
          shasum -a 256 "$IPA"

      - name: Upload signed iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-signed-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/ephinta-ios-export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary Apple signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/ephinta-ios-signing/ephinta-release.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/ephinta-ios-signing" "$HOME/Library/MobileDevice/Provisioning Profiles"
