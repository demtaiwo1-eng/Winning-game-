name: EPHINTA signed Android release

on:
  pull_request:
    paths:
      - ".github/workflows/ephinta-android-signed-release.yml"
      - "eventsss123/eventsss-main/docs/ANDROID_SIGNED_RELEASE.md"
      - "eventsss123/eventsss-main/scripts/setup-android-signing.sh"
  workflow_dispatch:
    inputs:
      release_label:
        description: Human-readable release label for the uploaded artifact
        required: false
        type: string
        default: EPHINTA Android release

permissions:
  contents: read

concurrency:
  group: ephinta-android-signed-release
  cancel-in-progress: false

jobs:
  validate-release-config:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML and required secret references
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ephinta-android-signed-release.yml", aliases: true)'
          grep -q 'secrets.ANDROID_KEYSTORE_BASE64' .github/workflows/ephinta-android-signed-release.yml
          grep -q 'secrets.ANDROID_KEYSTORE_PASSWORD' .github/workflows/ephinta-android-signed-release.yml
          grep -q 'secrets.ANDROID_KEY_ALIAS' .github/workflows/ephinta-android-signed-release.yml
          grep -q 'secrets.ANDROID_KEY_PASSWORD' .github/workflows/ephinta-android-signed-release.yml

  signed-release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Build and verify signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ephinta-wss.onrender.com/api/v1' }}
      VITE_UPDATE_URL: ${{ format('{0}/app-updates', vars.VITE_API_URL || 'https://ephinta-wss.onrender.com/api/v1') }}
      VITE_APP_VERSION: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Require owner-configured signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: ${name/KEYSTORE_B64/ANDROID_KEYSTORE_BASE64}"
              exit 1
            fi
          done

      - name: Install locked dependencies
        run: npm ci

      - name: Build production web assets
        run: npm run build:web

      - name: Sync Capacitor Android project
        run: npm run sync -w apps/mobile

      - name: Prepare protected keystore on runner
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/ephinta-release-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed APK and Play-ready AAB
        working-directory: eventsss123/eventsss-main/apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify APK and AAB signatures
        working-directory: eventsss123/eventsss-main/apps/mobile/android
        shell: bash
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          SIGNATURE="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\\n' "$SIGNATURE"
          ACTUAL_CERT="$(printf '%s\\n' "$SIGNATURE" | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}' | tr -d ':' | tr 'A-Z' 'a-z')"
          EXPECTED_NORMALIZED="$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr 'A-Z' 'a-z')"
          if [[ -z "$ACTUAL_CERT" || "$ACTUAL_CERT" != "$EXPECTED_NORMALIZED" ]]; then
            echo "::error::APK signing certificate does not match ANDROID_CERT_SHA256. Refusing to publish."
            exit 1
          fi
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK" >/dev/null
          AAB_CERT="$(keytool -printcert -jarfile "$AAB" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-Z' 'a-z')"
          if [[ -z "$AAB_CERT" || "$AAB_CERT" != "$EXPECTED_NORMALIZED" ]]; then
            echo "::error::AAB signing certificate does not match ANDROID_CERT_SHA256. Refusing to publish."
            exit 1
          fi
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          echo "APK SHA-256:"
          sha256sum "$APK"
          echo "AAB SHA-256:"
          sha256sum "$AAB"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-signed-android-${{ github.run_number }}
          path: |
            eventsss123/eventsss-main/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            eventsss123/eventsss-main/apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${RUNNER_TEMP:-}" ]]; then
            rm -f "$RUNNER_TEMP/ephinta-release-upload.jks"
          fi
