name: EPHINTA non-payment release verification

on:
  push:
    branches:
      - fix/ephinta-nonpayment-release-gates-20261114
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ephinta-nonpayment-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-nonpayment:
    name: Run non-payment release script
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install browser runtime dependencies
        working-directory: eventsss123/eventsss-main
        run: |
          npm ci
          npm exec --workspace @ess/web -- playwright install --with-deps chromium

      - name: Execute non-payment release verification script
        working-directory: .
        env:
          EPHINTA_RUN_ANDROID_BUILD: 'true'
          EPHINTA_INSTALL_ANDROID: 'false'
        run: bash eventsss123/eventsss-main/scripts/release/verify-nonpayment-release.sh

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-nonpayment-release-verification
          path: eventsss123/eventsss-main/artifacts/nonpayment-release-verification.txt
          if-no-files-found: warn
          retention-days: 30
