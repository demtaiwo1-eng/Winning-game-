name: EPHINTA Browser E2E and Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ephinta-browser-e2e-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: eventsss123/eventsss-main
jobs:
  browser-journeys:
    name: Browser portal journeys (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ess
          POSTGRES_PASSWORD: ess_test_password
          POSTGRES_DB: ess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ess -d ess_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_MODE: local
      DATABASE_URL_LOCAL: postgresql://ess:ess_test_password@127.0.0.1:5432/ess_test?schema=public
      DATABASE_URL: postgresql://ess:ess_test_password@127.0.0.1:5432/ess_test?schema=public
      JWT_SECRET: ci-only-secret-change-me-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('eventsss123/eventsss-main/package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Prepare disposable browser-test database
        run: |
          npm run prisma:generate
          npm run db:deploy -w apps/api
          npm run db:seed -w apps/api
      - name: Run public and authenticated portal journeys
        run: npm run test:e2e -w apps/web
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-playwright-diagnostics
          path: |
            eventsss123/eventsss-main/apps/web/test-results/
            eventsss123/eventsss-main/apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 5

  api-database-integration:
    name: API database integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ess
          POSTGRES_PASSWORD: ess_test_password
          POSTGRES_DB: ess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ess -d ess_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_MODE: local
      DATABASE_URL_LOCAL: postgresql://ess:ess_test_password@127.0.0.1:5432/ess_test?schema=public
      DATABASE_URL: postgresql://ess:ess_test_password@127.0.0.1:5432/ess_test?schema=public
      JWT_SECRET: ci-only-secret-change-me-0123456789abcdef0123456789abcdef
      RUN_DB_TESTS: "1"
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json
      - run: npm ci
      - name: Validate schema and generate Prisma client
        run: |
          npx prisma validate --schema apps/api/prisma/schema.prisma
          npm run prisma:generate
      - name: Apply disposable database migrations
        run: npm run db:deploy -w apps/api
      - name: Run API database integration tests
        run: npm run test:db -w apps/api

  production-build:
    name: Web and API production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET: ci-only-secret-change-me-0123456789abcdef0123456789abcdef
      VITE_API_URL: https://ephinta-wss.onrender.com/api/v1
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Build web once for browser and Android reuse
        run: npm run build:web
      - name: Build API
        run: npm run build -w apps/api
