name: EPHINTA one-go finalization and branch readiness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: ephinta-one-go-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: eventsss123/eventsss-main/apps/mobile/android/**/*.gradle*
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status
      - name: Run one-go branch and quality gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Prisma schema validation only needs a syntactically valid URL; no DB connection is made.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ephinta_ci?schema=public
        run: bash scripts/one-go-finalize-branches.sh
      - name: Upload Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-android-debug-apk
          path: eventsss123/eventsss-main/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload production web bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-web-production-build
          path: eventsss123/eventsss-main/apps/web/dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload finalization reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-one-go-finalization
          path: artifacts/one-go-finalization/
          if-no-files-found: warn
          retention-days: 30
