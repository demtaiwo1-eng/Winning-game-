name: App verification suite
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'eventsss123/eventsss-main/**'
      - '.github/workflows/verify-app-suite.yml'
  push:
    branches: [chore/android-launch-readiness]
    paths:
      - 'eventsss123/eventsss-main/**'
      - '.github/workflows/verify-app-suite.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ess
          POSTGRES_PASSWORD: ess
          POSTGRES_DB: ess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ess -d ess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_MODE: local
      DATABASE_URL_LOCAL: postgresql://ess:ess@127.0.0.1:5432/ess?schema=public
      DATABASE_URL: postgresql://ess:ess@127.0.0.1:5432/ess?schema=public
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json
      - run: chmod +x scripts/verify-all.sh
      - run: scripts/verify-all.sh
