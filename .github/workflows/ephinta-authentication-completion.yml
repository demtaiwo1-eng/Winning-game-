name: EPHINTA One-Go Application Completion

on:
  pull_request:
    paths:
      - '.github/workflows/ephinta-authentication-completion.yml'
      - 'eventsss123/eventsss-main/apps/api/**'
      - 'eventsss123/eventsss-main/apps/web/**'
      - 'eventsss123/eventsss-main/scripts/qa/complete-authentication.mjs'
      - 'eventsss123/eventsss-main/scripts/qa/complete-application.mjs'
      - 'eventsss123/eventsss-main/package.json'
  push:
    branches:
      - feat/authentication-completion-runner-20261119
      - feat/ephinta-one-go-completion-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentication-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ephinta
          POSTGRES_PASSWORD: ephinta_ci_only
          POSTGRES_DB: ephinta_auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ephinta -d ephinta_auth_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ephinta:ephinta_ci_only@localhost:5432/ephinta_auth_ci?schema=public
      DATABASE_URL_LOCAL: postgresql://ephinta:ephinta_ci_only@localhost:5432/ephinta_auth_ci?schema=public
      DATABASE_MODE: local
      JWT_SECRET: ci-only-secret-not-for-deployment-0123456789
      APP_BASE_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json
      - name: Enter application workspace
        working-directory: eventsss123/eventsss-main
        run: node --version && npm --version
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install supported Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Chromium for responsive UX audit
        working-directory: eventsss123/eventsss-main/apps/web
        run: npx playwright install --with-deps chromium
      - name: Run one-go application completion
        working-directory: eventsss123/eventsss-main
        run: npm run complete:application
      - name: Upload application completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-application-completion
          path: |
            eventsss123/eventsss-main/artifacts/authentication/
            eventsss123/eventsss-main/artifacts/application-completion/
          if-no-files-found: warn
          retention-days: 30
