name: Sync EPHINTA YouTube account playlists

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: ephinta-youtube-account-playlist-sync
  cancel-in-progress: false

jobs:
  refresh-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover playlists owned by the authorised account
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node eventsss123/eventsss-main/scripts/sync-wale-waves-playlists.mjs
      - name: Commit changed playlist catalogue
        run: |
          if git diff --quiet -- eventsss123/eventsss-main/apps/web/public/data/wale-waves-playlists.json; then
            echo "No playlist changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventsss123/eventsss-main/apps/web/public/data/wale-waves-playlists.json
          git commit -m "chore: refresh EPHINTA YouTube account playlists"
          git push origin HEAD:main
