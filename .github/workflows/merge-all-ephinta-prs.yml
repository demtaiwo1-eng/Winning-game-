name: EPHINTA one-run PR integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/merge-all-ephinta-prs.sh"
      - ".github/workflows/merge-all-ephinta-prs.yml"

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: ephinta-main-pr-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run sequential PR integration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/merge-all-ephinta-prs.sh
