name: Android install and launch compatibility matrix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "eventsss123/eventsss-main/apps/mobile/**"
      - "eventsss123/eventsss-main/apps/web/**"
      - "eventsss123/eventsss-main/package-lock.json"
      - ".github/workflows/android-install-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "eventsss123/eventsss-main/apps/mobile/**"
      - "eventsss123/eventsss-main/apps/web/**"
      - "eventsss123/eventsss-main/package-lock.json"
      - ".github/workflows/android-install-smoke.yml"

permissions:
  contents: read

concurrency:
  group: android-install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android test APK once
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: eventsss123/eventsss-main/apps/mobile/android/**/*.gradle*

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses <<'ANDROID_SDK_LICENSES'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          ANDROID_SDK_LICENSES
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web assets once
        run: npm run build:web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ephinta-wss.onrender.com/api/v1' }}

      - name: Sync Capacitor Android project
        run: npm run sync -w apps/mobile
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ephinta-wss.onrender.com/api/v1' }}

      - name: Build and inspect APK
        working-directory: eventsss123/eventsss-main/apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache --parallel assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          unzip -t "$APK" >/dev/null
          mkdir -p "$RUNNER_TEMP/ephinta-apk"
          cp "$APK" "$RUNNER_TEMP/ephinta-apk/app-debug.apk"
          sha256sum "$RUNNER_TEMP/ephinta-apk/app-debug.apk" > "$RUNNER_TEMP/ephinta-apk/SHA256SUMS.txt"

      - name: Upload single APK for emulator matrix
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-android-matrix-apk
          path: ${{ runner.temp }}/ephinta-apk/*
          if-no-files-found: error
          retention-days: 3

  install-and-launch:
    name: Android API ${{ matrix.api-level }} install and launch
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Android emulators are memory-intensive; sequential boot avoids starving
      # QEMU/ADB on standard hosted runners while still covering current OS levels.
      max-parallel: 1
      matrix:
        api-level: [35, 36]
    steps:
      - name: Download the same verified APK
        uses: actions/download-artifact@v4
        with:
          name: ephinta-android-matrix-apk
          path: artifacts/android

      - name: Install and launch APK on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -noaudio -gpu swiftshader_indirect -no-boot-anim -memory 2048 -cores 2
          disable-animations: true
          script: |
            set -e
            adb start-server
            timeout 180s adb wait-for-device
            timeout 300s sh -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r")" = "1" ]; do sleep 5; done'
            timeout 180s sh -c 'until adb shell pm list packages >/dev/null 2>&1; do sleep 5; done'
            test -s artifacts/android/app-debug.apk
            for attempt in 1 2 3; do timeout 180s adb install -r artifacts/android/app-debug.apk && break; [ "$attempt" -lt 3 ] || exit 1; sleep 5; done
            adb shell pm path com.ephinta.app | grep -q '^package:'
            adb shell am force-stop com.ephinta.app
            timeout 180s adb shell am start -n com.ephinta.app/.MainActivity
            launched=0
            attempt=1
            while [ "$attempt" -le 36 ]; do
              pid="$(adb shell pidof com.ephinta.app 2>/dev/null | tr -d '\\r' || true)"
              resumed="$(adb shell dumpsys activity activities 2>/dev/null | grep -F 'com.ephinta.app/.MainActivity' || true)"
              if [ -n "$pid" ] && [ -n "$resumed" ]; then
                launched=1
                break
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
            if [ "$launched" -ne 1 ]; then
              echo "EPHINTA did not reach a resumed MainActivity."
              adb shell dumpsys activity activities | tail -n 160 || true
              adb logcat -d -t 1200 | grep -Ei "com\\.ephinta\\.app|FATAL EXCEPTION|ANR in" | tail -n 240 || true
              exit 1
            fi
            echo "EPHINTA installed and remained running on Android API ${{ matrix.api-level }}."

      - name: Capture Android emulator diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/android-emulator-diagnostics"
          adb devices -l > "$RUNNER_TEMP/android-emulator-diagnostics/adb-devices.txt" 2>&1 || true
          adb shell getprop > "$RUNNER_TEMP/android-emulator-diagnostics/getprop.txt" 2>&1 || true
          adb logcat -d -t 3000 > "$RUNNER_TEMP/android-emulator-diagnostics/logcat.txt" 2>&1 || true

      - name: Upload Android emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics-api-${{ matrix.api-level }}
          path: ${{ runner.temp }}/android-emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 14
