name: Android install and launch compatibility matrix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-install-smoke-test
  pull_request:
    paths:
      - "eventsss123/eventsss-main/apps/mobile/**"
      - "eventsss123/eventsss-main/apps/web/**"
      - "eventsss123/eventsss-main/package-lock.json"
      - ".github/workflows/android-install-smoke.yml"

permissions:
  contents: read

concurrency:
  group: android-install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-launch:
    name: Android API ${{ matrix.api-level }} install and launch
    # Ubuntu 24.04 runners provide a more stable KVM-backed emulator environment
    # than the newly rolled-out ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Representative Android generations, including Android 11/API 30.
        api-level: [23, 26, 28, 29, 30, 31, 33, 34, 35, 36]
    defaults:
      run:
        working-directory: eventsss123/eventsss-main

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web application
        run: npm run build:web

      - name: Sync Capacitor Android project
        run: npm run sync -w apps/mobile

      - name: Build debug APK
        working-directory: eventsss123/eventsss-main/apps/mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BT/apksigner"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"

      - name: Install and launch APK on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          disable-animations: true
          timeout-minutes: 10
          script: |
            # The emulator action executes this script with /bin/sh (dash), not Bash.
            # Keep it POSIX-compatible; pipefail and the Bash ERR trap break before adb install.
            set -eu
            APK="eventsss123/eventsss-main/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
            dump_diagnostics() {
              echo "::group::ADB diagnostics"
              adb devices -l || true
              adb get-state || true
              adb shell getprop sys.boot_completed || true
              adb logcat -d -t 2000 || true
              echo "::endgroup::"
            }
            on_exit() {
              status=$?
              if [ "$status" -ne 0 ]; then
                echo "Android smoke test failed with exit code $status"
                dump_diagnostics
              fi
              exit "$status"
            }
            trap on_exit EXIT

            adb start-server
            adb wait-for-device
            booted=false
            for attempt in $(seq 1 90); do
              state="$(adb get-state 2>/dev/null || true)"
              completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$state" = "device" ] && [ "$completed" = "1" ]; then
                booted=true
                break
              fi
              sleep 5
            done
            if [ "$booted" != true ]; then
              echo "Emulator did not become fully ready before install."
              false
            fi

            timeout 120s adb install -r "$APK"
            adb shell pm path com.ephinta.app
            adb shell am force-stop com.ephinta.app
            timeout 60s adb shell am start -W -n com.ephinta.app/.MainActivity
            sleep 8
            if ! adb shell pidof com.ephinta.app >/dev/null; then
              echo "EPHINTA process did not remain alive after launch on API ${{ matrix.api-level }}."
              false
            fi
            echo "EPHINTA installed and remained running on Android API ${{ matrix.api-level }}."

      - name: Upload APK for manual device testing
        if: success() && matrix.api-level == 36
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-android-api36-emulator-verified-debug-apk
          path: eventsss123/eventsss-main/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
