name: Android install and launch compatibility matrix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "eventsss123/eventsss-main/apps/mobile/**"
      - "eventsss123/eventsss-main/apps/web/**"
      - "eventsss123/eventsss-main/package-lock.json"
      - ".github/workflows/android-install-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "eventsss123/eventsss-main/apps/mobile/**"
      - "eventsss123/eventsss-main/apps/web/**"
      - "eventsss123/eventsss-main/package-lock.json"
      - ".github/workflows/android-install-smoke.yml"

permissions:
  contents: read

concurrency:
  group: android-install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-launch:
    name: Android API ${{ matrix.api-level }} install and launch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Minimum supported version, Android 11, and a current Android generation.
        api-level: [23, 30, 35]
    defaults:
      run:
        working-directory: eventsss123/eventsss-main

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web application
        run: npm run build:web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ephinta-wss.onrender.com/api/v1' }}

      - name: Sync Capacitor Android project
        run: npm run sync -w apps/mobile
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ephinta-wss.onrender.com/api/v1' }}

      - name: Build and inspect debug APK
        working-directory: eventsss123/eventsss-main/apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BT/apksigner"
          test -x "$BT/aapt"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - name: Install and launch APK on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            # The runner executes each script line in a separate shell; keep commands self-contained.
            adb start-server
            timeout 240s adb wait-for-device
            timeout 360s sh -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r")" = "1" ]; do sleep 5; done'
            timeout 240s sh -c 'until adb shell pm list packages >/dev/null 2>&1; do sleep 5; done'
            test -s "eventsss123/eventsss-main/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
            for attempt in 1 2 3; do timeout 300s adb install -r "eventsss123/eventsss-main/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk" && break; [ "$attempt" -lt 3 ] || exit 1; sleep 10; done
            adb shell pm path com.ephinta.app | grep -q '^package:'
            adb shell am force-stop com.ephinta.app
            timeout 180s adb shell am start -W -n com.ephinta.app/.MainActivity
            sleep 8
            test -n "$(adb shell pidof com.ephinta.app | tr -d '\\r')"
            echo "EPHINTA installed and remained running on Android API ${{ matrix.api-level }}."

      - name: Capture Android emulator diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/android-emulator-diagnostics"
          adb devices -l > "$RUNNER_TEMP/android-emulator-diagnostics/adb-devices.txt" 2>&1 || true
          adb shell getprop > "$RUNNER_TEMP/android-emulator-diagnostics/getprop.txt" 2>&1 || true
          adb logcat -d -t 3000 > "$RUNNER_TEMP/android-emulator-diagnostics/logcat.txt" 2>&1 || true

      - name: Upload Android emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics-api-${{ matrix.api-level }}
          path: ${{ runner.temp }}/android-emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK for manual device testing
        if: success() && matrix.api-level == 23
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-android-debug-api-23
          path: eventsss123/eventsss-main/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
