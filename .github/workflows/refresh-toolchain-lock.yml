name: Refresh Vite and Vitest lockfile

on:
  push:
    branches:
      - security/upgrade-vite-vitest

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/upgrade-vite-vitest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Resolve patched Vite and Vitest packages
        working-directory: eventsss123/eventsss-main
        run: npm install --package-lock-only --include=dev --ignore-scripts

      - name: Commit refreshed lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventsss123/eventsss-main/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "chore(deps): refresh patched Vite and Vitest lockfile"
            git push origin HEAD:security/upgrade-vite-vitest
          fi
