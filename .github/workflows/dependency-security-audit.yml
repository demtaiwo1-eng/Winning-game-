name: Dependency security audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - integration/ephinta-release-candidate-final-20261114
    paths:
      - "eventsss123/eventsss-main/package.json"
      - "eventsss123/eventsss-main/package-lock.json"
      - "eventsss123/eventsss-main/apps/**/package.json"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - integration/ephinta-release-candidate-final-20261114
      - fix/ephinta-nonpayment-release-gates-20261114
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Dependency vulnerability gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Install locked dependencies
        working-directory: eventsss123/eventsss-main
        run: npm ci --include=dev

      - name: Block vulnerable production dependencies
        working-directory: eventsss123/eventsss-main
        run: npm audit --omit=dev --audit-level=high

      - name: Capture complete dependency audit reports
        working-directory: eventsss123/eventsss-main
        run: |
          mkdir -p "$RUNNER_TEMP/npm-audit"
          npm audit --json > "$RUNNER_TEMP/npm-audit/full.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit/production.json" || true
          node - "$RUNNER_TEMP/npm-audit" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const dir = process.argv[2];
          for (const [label, file] of [
            ["All dependencies", "full.json"],
            ["Production dependencies", "production.json"],
          ]) {
            let report = {};
            try { report = JSON.parse(fs.readFileSync(path.join(dir, file), "utf8")); }
            catch (error) { throw new Error(`${label} audit JSON invalid: ${error.message}`); }
            const v = report.metadata?.vulnerabilities || {};
            const line = `${label}: total=${v.total ?? "unknown"}; critical=${v.critical ?? 0}; high=${v.high ?? 0}; moderate=${v.moderate ?? 0}; low=${v.low ?? 0}`;
            console.log(line);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ${line}\n`);
          }
          NODE

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-audit
          path: ${{ runner.temp }}/npm-audit/
          if-no-files-found: error
          retention-days: 30

  secret-scan:
    name: Detect committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
