name: EPHINTA one-command production finalization

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ephinta-production-finalization.yml'
      - 'eventsss123/eventsss-main/scripts/complete-production-release.sh'

permissions:
  contents: read

concurrency:
  group: ephinta-production-finalization
  cancel-in-progress: false

jobs:
  validate:
    name: Validate finalizer script and workflow inputs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n eventsss123/eventsss-main/scripts/complete-production-release.sh

  finalize:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate]

    name: Verify live services and build original-key signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      EPHINTA_DB_BACKUP_RESTORE_VERIFIED: ${{ vars.EPHINTA_DB_BACKUP_RESTORE_VERIFIED }}
      EPHINTA_DB_DURABLE_BEFORE_EXPIRY: ${{ vars.EPHINTA_DB_DURABLE_BEFORE_EXPIRY }}
      EPHINTA_LIVE_PAYMENT_SETTLEMENT_VERIFIED: ${{ vars.EPHINTA_LIVE_PAYMENT_SETTLEMENT_VERIFIED }}
      EPHINTA_DSP_AD_SPONSOR_RECONCILIATION_VERIFIED: ${{ vars.EPHINTA_DSP_AD_SPONSOR_RECONCILIATION_VERIFIED }}
      EPHINTA_DSP_RIGHTS_OWNER_PAYOUTS_VERIFIED: ${{ vars.EPHINTA_DSP_RIGHTS_OWNER_PAYOUTS_VERIFIED }}
      EPHINTA_ANDROID_PHYSICAL_DEVICE_TESTED: ${{ vars.EPHINTA_ANDROID_PHYSICAL_DEVICE_TESTED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Run production finalizer
        id: finalize
        shell: bash
        run: |
          set +e
          bash scripts/complete-production-release.sh
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload signed APK and readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-production-finalization
          path: |
            eventsss123/eventsss-main/artifacts/production-finalization/*
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce final production gate
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.finalize.outputs.exit_code }}" != "0" ]]; then
            echo "::error::EPHINTA production finalization has unresolved external gates. See the uploaded readiness report."
            exit 1
          fi
