name: Publish Verified EPHINTA APK

on:
  workflow_run:
    workflows:
      - EPHINTA Web Checks and Android APK
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: ephinta-apk-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK build artifact
        uses: actions/download-artifact@v4
        with:
          name: ephinta-android-debug-apk
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find release-assets -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::The successful APK build did not contain an installable APK."
            exit 1
          fi
          cp "$APK" "release-assets/ephinta-${{ github.event.workflow_run.run_number }}.apk"
          sha256sum "release-assets/ephinta-${{ github.event.workflow_run.run_number }}.apk" \
            > "release-assets/ephinta-${{ github.event.workflow_run.run_number }}.apk.sha256"

      - name: Publish APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ephinta-apk-${{ github.event.workflow_run.id }}
          name: EPHINTA Android APK - Build ${{ github.event.workflow_run.run_number }}
          body: |
            Download the tested EPHINTA Android APK below.

            This build passed web checks and the Android APK build. SHA-256 checksum is included
            for integrity verification. This is an unsigned debug APK for testing.
          files: |
            release-assets/ephinta-${{ github.event.workflow_run.run_number }}.apk
            release-assets/ephinta-${{ github.event.workflow_run.run_number }}.apk.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
