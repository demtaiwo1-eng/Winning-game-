name: EPHINTA intellectual-property release gate

on:
  pull_request:
    paths:
      - "eventsss123/eventsss-main/docs/assets/asset-rights.json"
      - "eventsss123/eventsss-main/docs/ASSET_RIGHTS_REGISTER.md"
      - "eventsss123/eventsss-main/apps/web/public/**"
      - "eventsss123/eventsss-main/apps/web/src/lib/music/**"
      - "eventsss123/eventsss-main/apps/web/src/components/AudioExperience.tsx"
      - "eventsss123/eventsss-main/.agents/skills/**"
      - "eventsss123/eventsss-main/contracts/**"
      - "**/node_modules/**"
      - "eventsss123/package*.json"
      - ".gitignore"
      - "eventsss123/eventsss-main/scripts/qa/ephinta-ip-release-gate.mjs"
      - "eventsss123/eventsss-main/scripts/qa/ephinta-license-inventory.mjs"
      - ".github/workflows/ephinta-ip-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-rights:
    name: Check source and asset rights gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch pinned SPDX standard licence texts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/spdx-license-texts
          SPDX_COMMIT=31846481de7ea17d92f2f46fad76abe58b2e9bb0
          for license in MIT ISC Apache-2.0 BSD-2-Clause BSD-3-Clause MPL-2.0 BlueOak-1.0.0 Unlicense CC-BY-4.0 MIT-0 0BSD CC0-1.0; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/spdx/license-list-data/${SPDX_COMMIT}/text/${license}.txt" \
              --output "artifacts/spdx-license-texts/${license}.txt"
          done
      - name: Generate package notices
        env:
          SPDX_LICENSE_TEXT_DIR: artifacts/spdx-license-texts
        run: node scripts/qa/ephinta-license-inventory.mjs
      - name: Verify commercial asset and source gates
        run: node scripts/qa/ephinta-ip-release-gate.mjs
