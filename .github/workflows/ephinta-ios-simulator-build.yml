name: EPHINTA iOS Simulator Build

on:
  pull_request:
    branches: [main]
    paths:
      - "eventsss123/eventsss-main/apps/web/**"
      - "eventsss123/eventsss-main/apps/mobile/**"
      - "eventsss123/eventsss-main/package*.json"
  push:
    branches: [main]
    paths:
      - "eventsss123/eventsss-main/apps/web/**"
      - "eventsss123/eventsss-main/apps/mobile/**"
      - "eventsss123/eventsss-main/package*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ephinta-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: Build unsigned iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ephinta-wss.onrender.com/api/v1' }}
          VITE_UPDATE_URL: ${{ format('{0}/app-updates', vars.VITE_API_URL || 'https://ephinta-wss.onrender.com/api/v1') }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Install Playwright Chromium for audio browser checks
        run: npx playwright install chromium

      - name: Verify EPHINTA audio assets, controls and web build
        run: npm run audio:verify -w apps/web
        env:
          EPHINTA_AUDIO_SKIP_BROWSER_TESTS: "true"

      - name: Sync Capacitor iOS project and CocoaPods
        run: npm run ios:sync -w apps/mobile

      - name: Inspect Xcode project
        run: xcodebuild -list -workspace apps/mobile/ios/App/App.xcworkspace

      - name: Build unsigned iOS Simulator target
        run: |
          xcodebuild \
            -workspace apps/mobile/ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ephinta-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-ios-simulator-app
          path: ${{ runner.temp }}/ephinta-ios-derived/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7

      - name: Record distribution limitation
        if: success()
        run: echo "Unsigned simulator build passed. Physical-device/App Store distribution still requires Apple signing credentials and provisioning."
