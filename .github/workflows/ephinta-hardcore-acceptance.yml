name: EPHINTA Hardcore Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "eventsss123/eventsss-main/**"
      - ".github/workflows/ephinta-hardcore-acceptance.yml"
  push:
    branches:
      - "integration/ephinta-release-candidate-final-20261114"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ephinta-hardcore-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Full code, database, IP, UX, payment simulation and Android acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ephinta
          POSTGRES_PASSWORD: ephinta_ci_only_password
          POSTGRES_DB: ephinta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ephinta -d ephinta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    env:
      CI: "1"
      NODE_ENV: test
      DATABASE_URL: postgresql://ephinta:ephinta_ci_only_password@localhost:5432/ephinta_ci?schema=public
      JWT_SECRET: ephinta-ci-only-secret-0123456789abcdef0123456789abcdef
      APP_BASE_URL: http://localhost:3000
      RUN_DB_TESTS: "1"
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run complete acceptance runner
        run: node scripts/release/ephinta-hardcore-acceptance.mjs

      - name: Upload acceptance report and build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-hardcore-acceptance-${{ github.run_number }}
          path: |
            eventsss123/eventsss-main/artifacts/ephinta-hardcore-acceptance.json
            eventsss123/eventsss-main/apps/web/dist/
            eventsss123/eventsss-main/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
