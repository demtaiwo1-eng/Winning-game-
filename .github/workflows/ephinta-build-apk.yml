name: EPHINTA Web Checks and Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ephinta-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    name: Test and build responsive web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ess
          POSTGRES_PASSWORD: ess
          POSTGRES_DB: ess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ess -d ess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_MODE: local
      DATABASE_URL_LOCAL: postgresql://ess:ess@127.0.0.1:5432/ess?schema=public
      DATABASE_URL: postgresql://ess:ess@127.0.0.1:5432/ess?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      APP_BASE_URL: http://localhost:3000
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore Rollup Linux optional dependency
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@4.63.5

      - name: Check whether a shared online API is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$VITE_API_URL" ]]; then
            echo "::warning::VITE_API_URL is not set. This run can build an offline-capable APK artifact, but it cannot be published as an online-ready release."
            mkdir -p "$RUNNER_TEMP/ephinta-api-check"
            printf 'false\n' > "$RUNNER_TEMP/ephinta-api-check/ready"
            exit 0
          fi
          case "$VITE_API_URL" in https://*/api/v1) ;; *)
            echo "::error::VITE_API_URL must be an HTTPS URL ending in /api/v1."
            exit 1
          esac
          API_ORIGIN="${VITE_API_URL%/api/v1}"
          curl --fail --silent --show-error --retry 6 --retry-delay 10 "$API_ORIGIN/health"
          curl --fail --silent --show-error --retry 6 --retry-delay 10 "$API_ORIGIN/ready"
          mkdir -p "$RUNNER_TEMP/ephinta-api-check"
          printf 'true\n' > "$RUNNER_TEMP/ephinta-api-check/ready"

      - name: Save online API readiness result
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-apk-api-readiness
          path: ${{ runner.temp }}/ephinta-api-check/ready
          if-no-files-found: error
          retention-days: 30

      - name: Run API and web checks
        run: npm run check

      - name: Apply migrations to disposable CI database
        run: npm run db:deploy -w apps/api

      - name: Run API database integration tests
        run: npm run test:db -w apps/api
        env:
          RUN_DB_TESTS: "1"

      - name: Build web app
        run: npm run build -w apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-web-dist
          path: eventsss123/eventsss-main/apps/web/dist/
          if-no-files-found: error
          retention-days: 30

  android-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    needs: web-checks
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Restore Rollup Linux optional dependency
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@4.63.5

      - name: Build web assets for the deployed API
        run: npm run build -w apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Sync Capacitor Android project
        shell: bash
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          if npm run | grep -qE 'mobile:sync'; then
            npm run mobile:sync
          else
            npx cap sync android --config apps/mobile/capacitor.config.ts
          fi

      - name: Locate Android Gradle project
        id: android-path
        shell: bash
        run: |
          set -euo pipefail
          candidates=("apps/mobile/android" "apps/mobile" "android")
          for candidate in "${candidates[@]}"; do
            if [[ -f "$candidate/gradlew" && ( -f "$candidate/build.gradle" || -f "$candidate/build.gradle.kts" || -f "$candidate/settings.gradle" || -f "$candidate/settings.gradle.kts" ) ]]; then
              echo "dir=$candidate" >> "$GITHUB_OUTPUT"
              echo "Found Gradle wrapper in $candidate"
              exit 0
            fi
          done
          echo "ERROR: Could not find gradlew and Gradle settings/build files." >&2
          find apps/mobile -maxdepth 4 -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print || true
          exit 1

      - name: Build debug APK
        working-directory: ${{ github.workspace }}/eventsss123/eventsss-main/${{ steps.android-path.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ephinta-apk"
          find apps/mobile android -type f -path '*/build/outputs/apk/*/*.apk' -print -exec cp '{}' "$RUNNER_TEMP/ephinta-apk/" \; 2>/dev/null || true
          if [[ -z "$(find "$RUNNER_TEMP/ephinta-apk" -type f -name '*.apk' -print -quit)" ]]; then
            find . -type f -path '*/build/outputs/apk/*/*.apk' -print -exec cp '{}' "$RUNNER_TEMP/ephinta-apk/" \;
          fi
          test -n "$(find "$RUNNER_TEMP/ephinta-apk" -type f -name '*.apk' -print -quit)"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-android-debug-apk
          path: ${{ runner.temp }}/ephinta-apk/*.apk
          if-no-files-found: error
          retention-days: 30
