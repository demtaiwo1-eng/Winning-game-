name: Migrate Render PostgreSQL (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_restore:
        description: 'Type MIGRATE to restore the old database into the new database'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: render-postgres-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm_restore == 'MIGRATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate required secrets without printing them
        env:
          OLD_DATABASE_URL: ${{ secrets.OLD_RENDER_DATABASE_URL }}
          NEW_DATABASE_URL: ${{ secrets.NEW_RENDER_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$OLD_DATABASE_URL" || { echo "::error::OLD_RENDER_DATABASE_URL is missing"; exit 1; }
          test -n "$NEW_DATABASE_URL" || { echo "::error::NEW_RENDER_DATABASE_URL is missing"; exit 1; }
          case "$OLD_DATABASE_URL" in postgres://*|postgresql://*) ;; *) echo "::error::Old URL is not a PostgreSQL URL"; exit 1;; esac
          case "$NEW_DATABASE_URL" in postgres://*|postgresql://*) ;; *) echo "::error::New URL is not a PostgreSQL URL"; exit 1;; esac

      - name: Confirm source and destination are different databases
        env:
          OLD_DATABASE_URL: ${{ secrets.OLD_RENDER_DATABASE_URL }}
          NEW_DATABASE_URL: ${{ secrets.NEW_RENDER_DATABASE_URL }}
        run: |
          set -euo pipefail
          old_db="$(psql "$OLD_DATABASE_URL" -X -Atqc 'select current_database()')"
          new_db="$(psql "$NEW_DATABASE_URL" -X -Atqc 'select current_database()')"
          if [ "$OLD_DATABASE_URL" = "$NEW_DATABASE_URL" ] || [ "$old_db" = "$new_db" ]; then
            echo "::error::Source and destination appear to be the same database; refusing to continue."
            exit 1
          fi
          echo "Source and destination connections are reachable and database names differ."

      - name: Dump source and restore destination
        env:
          OLD_DATABASE_URL: ${{ secrets.OLD_RENDER_DATABASE_URL }}
          NEW_DATABASE_URL: ${{ secrets.NEW_RENDER_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          dump_file="$RUNNER_TEMP/render-source.dump"
          trap 'rm -f "$dump_file"' EXIT
          pg_dump --no-owner --no-acl --format=custom --file="$dump_file" "$OLD_DATABASE_URL"
          pg_restore --clean --if-exists --no-owner --no-acl --exit-on-error --dbname="$NEW_DATABASE_URL" "$dump_file"

      - name: Verify restored schema and table counts
        env:
          OLD_DATABASE_URL: ${{ secrets.OLD_RENDER_DATABASE_URL }}
          NEW_DATABASE_URL: ${{ secrets.NEW_RENDER_DATABASE_URL }}
        run: |
          set -euo pipefail
          old_tables="$(psql "$OLD_DATABASE_URL" -X -Atqc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")"
          new_tables="$(psql "$NEW_DATABASE_URL" -X -Atqc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")"
          echo "Source public tables: $old_tables"
          echo "Destination public tables: $new_tables"
          if [ "$old_tables" -ne "$new_tables" ]; then
            echo "::error::Public table counts differ; inspect migration before switching services."
            exit 1
          fi
          echo "Schema table-count check passed. Application-level validation is still required."
