name: EPHINTA one-go launch readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ephinta-one-go-launch-readiness
  cancel-in-progress: false

jobs:
  launch-readiness:
    name: Run complete launch-readiness script
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ess
          POSTGRES_PASSWORD: ess
          POSTGRES_DB: ess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ess -d ess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_MODE: local
      DATABASE_URL: postgresql://ess:ess@127.0.0.1:5432/ess?schema=public
      DATABASE_URL_LOCAL: postgresql://ess:ess@127.0.0.1:5432/ess?schema=public
      RUN_DB_TESTS: "1"
      REQUIRE_PRODUCTION_SIGNING: "1"
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ephinta-wss.onrender.com/api/v1' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Set up Java and Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: eventsss123/eventsss-main/apps/mobile/android/**/*.gradle*

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses <<'ANDROID_SDK_LICENSES'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          ANDROID_SDK_LICENSES
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Run all launch-readiness phases on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 45
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -euo pipefail
            export ANDROID_DEVICE_IS_PHYSICAL=0
            bash scripts/complete-launch-readiness.sh

      - name: Upload readiness report and APK outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-one-go-launch-readiness
          path: |
            eventsss123/eventsss-main/artifacts/complete-launch-readiness/
          if-no-files-found: warn
          retention-days: 30
