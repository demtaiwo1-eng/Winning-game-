name: EPHINTA Safe Branch Consolidation and Release Gate

on:
  push:
    branches:
      - integration/ephinta-release-candidate-final-20261114
    paths:
      - "eventsss123/eventsss-main/scripts/release/consolidate-all-branches-safely.sh"
      - ".github/workflows/ephinta-branch-consolidation.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ephinta-branch-consolidation
  cancel-in-progress: false

jobs:
  consolidate-and-verify:
    name: Merge branches safely, then run full release acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ephinta
          POSTGRES_PASSWORD: ephinta_ci_only_password
          POSTGRES_DB: ephinta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ephinta -d ephinta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "1"
      NODE_ENV: test
      DATABASE_URL: postgresql://ephinta:ephinta_ci_only_password@localhost:5432/ephinta_ci?schema=public
      DATABASE_URL_LOCAL: postgresql://ephinta:ephinta_ci_only_password@localhost:5432/ephinta_ci?schema=public
      JWT_SECRET: ephinta-ci-only-secret-0123456789abcdef0123456789abcdef
      APP_BASE_URL: http://localhost:3000
      RUN_DB_TESTS: "1"
      SPDX_LICENSE_TEXT_DIR: artifacts/spdx-license-texts
    defaults:
      run:
        working-directory: eventsss123/eventsss-main
    steps:
      - name: Checkout all branch history with push credentials
        uses: actions/checkout@v4
        with:
          ref: integration/ephinta-release-candidate-final-20261114
          fetch-depth: 0
          persist-credentials: true

      - name: Configure integration commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Consolidate each remote branch only after checks pass
        run: bash scripts/release/consolidate-all-branches-safely.sh

      - name: Install Playwright Chromium and Linux dependencies
        run: npm exec -w apps/web -- playwright install --with-deps chromium

      - name: Fetch pinned SPDX standard licence texts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/spdx-license-texts
          SPDX_COMMIT=31846481de7ea17d92f2f46fad76abe58b2e9bb0
          for license in MIT ISC Apache-2.0 BSD-2-Clause BSD-3-Clause MPL-2.0 BlueOak-1.0.0 Unlicense CC-BY-4.0 MIT-0 0BSD CC0-1.0; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/spdx/license-list-data/${SPDX_COMMIT}/text/${license}.txt" \
              --output "artifacts/spdx-license-texts/${license}.txt"
          done

      - name: Run full release acceptance against consolidated source
        run: node scripts/release/ephinta-hardcore-acceptance.mjs

      - name: Upload consolidation and release reports plus APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephinta-consolidation-release-${{ github.run_number }}
          path: |
            eventsss123/eventsss-main/artifacts/branch-consolidation-report.tsv
            eventsss123/eventsss-main/artifacts/ephinta-hardcore-acceptance.json
            eventsss123/eventsss-main/apps/web/dist/
            eventsss123/eventsss-main/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
