name: EPHINTA Windows verification

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify-ephinta.ps1"
      - ".github/workflows/ephinta-windows-verification.yml"
      - "eventsss123/eventsss-main/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ephinta-windows-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    name: API, web, browser and design verification (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eventsss123/eventsss-main/package-lock.json
      - name: Run guarded EPHINTA verification script
        shell: pwsh
        run: ./scripts/verify-ephinta.ps1 -SkipAndroid -SkipBrowser
