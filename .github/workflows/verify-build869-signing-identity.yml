name: Verify Build 869 Android Signing Identity

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ephinta-build869-signing-verification
  cancel-in-progress: false

jobs:
  verify-original-key:
    name: Match stored keystore to Build 869
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download immutable Build 869 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ephinta-869"
          curl --fail --location --retry 3 \
            "https://github.com/demtaiwo1-eng/Winning-game-/releases/download/ephinta-apk-42547397876/ephinta-869.apk" \
            --output "$RUNNER_TEMP/ephinta-869/ephinta-869.apk"
          test -s "$RUNNER_TEMP/ephinta-869/ephinta-869.apk"

      - name: Inspect every keystore alias against Build 869
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/ephinta-original.jks"
          CERT="$RUNNER_TEMP/ephinta-candidate-cert.der"
          CSR="$RUNNER_TEMP/ephinta-candidate.csr"
          trap 'rm -f "$KEYSTORE" "$CERT" "$CSR"' EXIT

          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret is missing: $name"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER" && test -x "$AAPT"

          BASELINE="$RUNNER_TEMP/ephinta-869/ephinta-869.apk"
          PACKAGE="$("$AAPT" dump badging "$BASELINE" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          [[ "$PACKAGE" == "com.ephinta.app" ]] || {
            echo "::error::Build 869 baseline package mismatch."
            exit 1
          }

          BASELINE_CERT="$("$APKSIGNER" verify --print-certs "$BASELINE" 2>&1 | \
            sed -n 's/.*certificate SHA-256 digest: *//Ip' | head -n 1 | tr -d ' :\\r\\n' | tr '[:upper:]' '[:lower:]')"
          [[ "$BASELINE_CERT" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error::Could not extract Build 869 SHA-256 signing fingerprint."
            exit 1
          }
          echo "Build 869 certificate SHA-256: $BASELINE_CERT"

          # List private-key aliases only; never print passwords, key material, or keystore bytes.
          keytool -J-Duser.language=en -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" >/dev/null
          mapfile -t ALIASES < <(
            keytool -J-Duser.language=en -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" |
              awk -F, '/PrivateKeyEntry/ { alias=$1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", alias); if (alias != "") print alias }'
          )
          if (( ${#ALIASES[@]} == 0 )); then
            echo "::error::No private-key aliases were found in the stored keystore."
            exit 1
          fi

          MATCHED_ALIAS=""
          MATCHED_FINGERPRINT=""
          for alias in "${ALIASES[@]}"; do
            rm -f "$CERT" "$CSR"
            if ! keytool -exportcert -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" \
              -alias "$alias" -file "$CERT" >/dev/null 2>&1; then
              echo "Alias inspected (certificate export unavailable): $alias"
              continue
            fi
            fingerprint="$(sha256sum "$CERT" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
            echo "Inspected private-key alias: $alias (SHA-256: $fingerprint)"
            if [[ "$fingerprint" == "$BASELINE_CERT" ]]; then
              MATCHED_ALIAS="$alias"
              MATCHED_FINGERPRINT="$fingerprint"
              break
            fi
          done

          if [[ -z "$MATCHED_ALIAS" ]]; then
            echo "::error::No private-key alias in the stored keystore matches Build 869. No repository variable or secret was changed."
            exit 1
          fi

          echo "MATCH FOUND: alias '$MATCHED_ALIAS' matches Build 869."
          # Confirm this alias has a usable private key and that the configured key password opens it.
          if ! keytool -certreq -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" -alias "$MATCHED_ALIAS" -file "$CSR" >/dev/null 2>&1; then
            echo "::error::The matching certificate alias was found, but ANDROID_KEY_PASSWORD did not unlock its private key. No repository setting was changed."
            exit 1
          fi

          if [[ "$MATCHED_ALIAS" != "$KEY_ALIAS" ]]; then
            echo "::error::The original Build 869 key is present under alias '$MATCHED_ALIAS', but ANDROID_KEY_ALIAS is currently configured as '$KEY_ALIAS'. Update the GitHub Actions secret ANDROID_KEY_ALIAS to the exact matching alias, then rerun this workflow. No secret or variable was changed."
            exit 1
          fi

          echo "Configured alias and private-key password verified against Build 869."
          # Create/update the public fingerprint variable only after an exact match.
          if gh api "repos/$GH_REPO/actions/variables/ANDROID_CERT_SHA256" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/actions/variables/ANDROID_CERT_SHA256" \
              -f name="ANDROID_CERT_SHA256" -f value="$MATCHED_FINGERPRINT" >/dev/null
          else
            gh api --method POST "repos/$GH_REPO/actions/variables" \
              -f name="ANDROID_CERT_SHA256" -f value="$MATCHED_FINGERPRINT" >/dev/null
          fi
          echo "Repository variable ANDROID_CERT_SHA256 set from the verified Build 869 certificate."
